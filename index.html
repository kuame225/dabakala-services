<script>
  window.__errors = [];
  function renderBanner() {
    if (!document.body) return;
    var el = document.getElementById("debug-banner");
    if (!el) {
      el = document.createElement("div");
      el.id = "debug-banner";
      el.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#B3261E;color:#fff;padding:10px;font:12px monospace;white-space:pre-wrap;max-height:60vh;overflow:auto;";
      document.body.appendChild(el);
    }
    el.textContent = window.__errors.join("\n\n---\n\n");
  }
  function showDebugBanner(msg) {
    window.__errors.push(msg);
    if (document.body) renderBanner();
    else document.addEventListener("DOMContentLoaded", renderBanner);
  }
  window.addEventListener("error", function (e) {
    var tag = e.target && e.target.tagName;
    if (e.target && e.target !== window) {
      if (tag === "SCRIPT" || tag === "LINK") {
        showDebugBanner("Échec de chargement : " + (e.target.src || e.target.href));
      }
      // autres ressources (images, tuiles de carte...) : on ignore, non bloquant
      return;
    }
    if (e.message) {
      showDebugBanner("Erreur JS : " + e.message + "\n" + (e.filename || "") + ":" + (e.lineno || ""));
    }
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    showDebugBanner("Promesse rejetée : " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  window.addEventListener("load", function () {
    setTimeout(function () {
      var root = document.getElementById("root");
      if (root && root.children.length === 0 && window.__errors.length === 0) {
        showDebugBanner("Aucune erreur détectée, mais l'app ne s'est pas affichée après 4 secondes. Vérifie ta connexion internet (les librairies se chargent depuis cdnjs.cloudflare.com) ou essaie de vider le cache du navigateur.");
      }
    }, 4000);
  });
</script>

/* ------------------------------------------------------------------ */
/* Couche d'accès aux données — Supabase remplace localStorage        */
/* ------------------------------------------------------------------ */
const api = {
  async fetchCategories() {
    const { data, error } = await supabase.from("categories").select("*").order("sort_order");
    return error ? FALLBACK_CATEGORIES : data;
  },
  async insertCategory(payload) {
    return supabase.from("categories").insert(payload);
  },
  async updateCategory(id, payload) {
    return supabase.from("categories").update(payload).eq("id", id);
  },
  async deleteCategory(id) {
    return supabase.from("categories").delete().eq("id", id);
  },
  // Utilisateur non connecté ou rôle client : seules les fiches validées remontent (RLS).
  // Agent/Admin connectés : le RLS laisse remonter aussi les fiches en attente.
  async fetchProviders() {
    const { data, error } = await supabase.from("providers").select("*").order("created_at", { ascending: false });
    if (error) { console.error(error); return []; }
    return data;
  },
  async insertProvider(payload) {
    return supabase.from("providers").insert(payload).select().single();
  },
  async updateProvider(id, payload) {
    return supabase.from("providers").update(payload).eq("id", id);
  },
  async deleteProvider(id) {
    return supabase.from("providers").delete().eq("id", id);
  },
  async setValidated(id, value) {
    return supabase.rpc("set_validated", { p_provider_id: id, p_value: value });
  },
  async setVerifiedField(id, value) {
    return supabase.rpc("set_verified_field", { p_provider_id: id, p_value: value });
  },
  async getProfile(userId) {
    const { data, error } = await supabase.from("profiles").select("*").eq("id", userId).single();
    return error ? null : data;
  },
  async uploadPhoto(file) {
    const path = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}-${file.name}`;
    const { error } = await supabase.storage.from("provider-photos").upload(path, file);
    if (error) throw error;
    const { data } = supabase.storage.from("provider-photos").getPublicUrl(path);
    return data.publicUrl;
  },
  async fetchReviews(providerId) {
    const { data, error } = await supabase.from("reviews").select("*, profiles(full_name)").eq("provider_id", providerId).order("created_at", { ascending: false });
    return error ? [] : data;
  },
  async fetchRecentReviews() {
    const { data, error } = await supabase.from("reviews").select("*, providers(name, added_by)").order("created_at", { ascending: false }).limit(50);
    return error ? [] : data;
  },
  async fetchMyReviews(userId) {
    const { data, error } = await supabase.from("reviews").select("*, providers(name, category_id)").eq("user_id", userId).order("created_at", { ascending: false });
    return error ? [] : data;
  },
  async updateFullName(userId, fullName) {
    return supabase.from("profiles").update({ full_name: fullName }).eq("id", userId);
  },
  async upsertReview(providerId, userId, rating, comment) {
    return supabase.from("reviews").upsert(
      { provider_id: providerId, user_id: userId, rating, comment },
      { onConflict: "provider_id,user_id" }
    );
  },
  async isFavorite(providerId, userId) {
    const { data } = await supabase.from("favorites").select("*").eq("provider_id", providerId).eq("user_id", userId).single();
    return !!data;
  },
  async fetchFavoriteProviders(userId) {
    const { data, error } = await supabase.from("favorites").select("provider_id, providers(*)").eq("user_id", userId);
    if (error || !data) return [];
    return data.map((row) => row.providers).filter(Boolean);
  },
  async setFavorite(providerId, userId, value) {
    if (value) return supabase.from("favorites").insert({ provider_id: providerId, user_id: userId });
    return supabase.from("favorites").delete().eq("provider_id", providerId).eq("user_id", userId);
  },
  async fetchServices(providerId) {
    const { data, error } = await supabase.from("provider_services").select("*").eq("provider_id", providerId).order("sort_order");
    return error ? [] : data;
  },
  async addService(providerId, name, priceText, sortOrder) {
    return supabase.from("provider_services").insert({ provider_id: providerId, name, price_text: priceText, sort_order: sortOrder });
  },
  async deleteService(id) {
    return supabase.from("provider_services").delete().eq("id", id);
  },
  async fetchGalleryPhotos(providerId) {
    const { data, error } = await supabase.from("provider_photos").select("*").eq("provider_id", providerId).order("sort_order");
    return error ? [] : data;
  },
  async addGalleryPhoto(providerId, photoUrl, sortOrder) {
    return supabase.from("provider_photos").insert({ provider_id: providerId, photo_url: photoUrl, sort_order: sortOrder });
  },
  async deleteGalleryPhoto(id) {
    return supabase.from("provider_photos").delete().eq("id", id);
  },
};

function AuthForm({ onDone }) {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [fullName, setFullName] = useState("");
  const [error, setError] = useState("");
  const [info, setInfo] = useState("");
  const [busy, setBusy] = useState(false);

  const submit = async () => {
    setError(""); setInfo(""); setBusy(true);
    try {
      if (mode === "login") {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) throw error;
        onDone && onDone();
      } else {
        const { data, error } = await supabase.auth.signUp({ email, password, options: { data: { full_name: fullName } } });
        if (error) throw error;
        if (data.session) {
          // Confirmation email désactivée côté Supabase : compte actif immédiatement.
          onDone && onDone();
        } else {
          // Confirmation email requise : pas de session tant que le lien n'est pas cliqué.
          setInfo("Compte créé ! Vérifie ta boîte mail (" + email + ") et clique sur le lien de confirmation, puis reviens te connecter ici.");
          setMode("login");
        }
      }
    } catch (e) {
      setError(e.message || "Erreur");
    } finally {
      setBusy(false);
    }
  };

  const withGoogle = async () => {
    setError("");
    const { error } = await supabase.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.href },
    });
    if (error) setError(error.message);
  };

  return (
    <div className="flex flex-col h-full items-center justify-center px-6" style={{ background: T.cream }}>
      <div className="w-full rounded-2xl p-5" style={{ background: "var(--card)", border: `1px solid ${T.line}` }}>
        <h2 className="font-bold text-base mb-3" style={{ color: T.ink }}>
          {mode === "login" ? "Connexion" : "Créer un compte"}
        </h2>
        <button onClick={withGoogle} className="w-full mb-3 flex items-center justify-center gap-2 rounded-xl py-2.5 font-semibold"
          style={{ background: "var(--card)", border: `1px solid ${T.line}`, color: T.ink }}>
          <span style={{ fontSize: 16 }}>🔵</span> Continuer avec Google
        </button>
        <div className="flex items-center gap-2 mb-3">
          <div className="flex-1 h-px" style={{ background: T.line }} />
          <span className="text-[10px] font-semibold" style={{ color: T.mute }}>OU</span>
          <div className="flex-1 h-px" style={{ background: T.line }} />
        </div>
        {mode === "signup" && (
          <input value={fullName} onChange={(e) => setFullName(e.target.value)} placeholder="Nom complet"
            className="w-full mb-2 rounded-lg px-3 py-2 text-sm outline-none" style={{ background: T.cream, border: `1px solid ${T.line}` }} />
        )}
        <input value={email} onChange={(e) => setEmail(e.target.value)} placeholder="Email" type="email"
          className="w-full mb-2 rounded-lg px-3 py-2 text-sm outline-none" style={{ background: T.cream, border: `1px solid ${T.line}` }} />
        <input value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Mot de passe" type="password"
          className="w-full mb-3 rounded-lg px-3 py-2 text-sm outline-none" style={{ background: T.cream, border: `1px solid ${T.line}` }} />
        {info && <div className="text-xs mb-2 font-semibold" style={{ color: T.greenDeep }}>{info}</div>}
        {error && <div className="text-xs mb-2" style={{ color: T.orange }}>{error}</div>}
        <button onClick={submit} disabled={busy} className="w-full rounded-xl py-2.5 font-semibold text-white" style={{ background: T.navy }}>
          {busy ? "…" : mode === "login" ? "Se connecter" : "S'inscrire"}
        </button>
        <button onClick={() => { setMode(mode === "login" ? "signup" : "login"); setError(""); setInfo(""); }} className="w-full mt-2 text-xs font-semibold" style={{ color: T.blue }}>
          {mode === "login" ? "Pas de compte ? S'inscrire" : "Déjà un compte ? Se connecter"}
        </button>
      </div>
    </div>
  );
}

    );
  }

}

function RealMap({ providers, selectedId, onSelect, height = 220, showLocateButton = false }) {
  const mapDivRef = useRef(null);
  const mapRef = useRef(null);
  const markersRef = useRef({});
  const userMarkerRef = useRef(null);
  const [locating, setLocating] = useState(false);
  const [locateErr, setLocateErr] = useState("");

  useEffect(() => {
    if (!mapDivRef.current || mapRef.current || !window.L) return;
    const map = window.L.map(mapDivRef.current, { attributionControl: false }).setView(DABAKALA_CENTER, 13);
    window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "© OpenStreetMap",
    }).addTo(map);
    window.L.control.attribution({ prefix: false, position: "bottomright" }).addTo(map);
    mapRef.current = map;
    return () => { map.remove(); mapRef.current = null; };
  }, []);

  useEffect(() => {
    const map = mapRef.current;
    if (!map) return;
    Object.values(markersRef.current).forEach((m) => map.removeLayer(m));
    markersRef.current = {};
    const pts = providers.filter((p) => p.lat && p.lng);
    pts.forEach((p) => {
      const active = p.id === selectedId;
      const size = active ? 34 : 26;
      const icon = window.L.divIcon({
        html: `<div style="width:${size}px;height:${size}px;border-radius:9999px;background:${active ? T.orange : T.navy};border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:${active ? 15 : 12}px;box-shadow:0 1px 4px rgba(0,0,0,0.35);">📍</div>`,
        className: "",
        iconSize: [size, size],
        iconAnchor: [size / 2, size],
      });
      const marker = window.L.marker([p.lat, p.lng], { icon }).addTo(map);
      marker.bindTooltip(p.name, { direction: "top", offset: [0, -size] });
      marker.on("click", () => onSelect(p.id));
      markersRef.current[p.id] = marker;
    });
    if (pts.length > 0) {
      const bounds = window.L.latLngBounds(pts.map((p) => [p.lat, p.lng]));
      map.fitBounds(bounds, { padding: [28, 28], maxZoom: 16 });
    } else {
      map.setView(DABAKALA_CENTER, 13);
    }
  }, [providers, selectedId]);

  const locateMe = () => {
    if (!navigator.geolocation) { setLocateErr("Géolocalisation non supportée sur cet appareil."); return; }
    setLocating(true); setLocateErr("");
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        setLocating(false);
        const { latitude, longitude } = pos.coords;
        const map = mapRef.current;
        if (!map) return;
        if (userMarkerRef.current) map.removeLayer(userMarkerRef.current);
        const icon = window.L.divIcon({
          html: `<div style="width:16px;height:16px;border-radius:9999px;background:${T.blue};border:3px solid #fff;box-shadow:0 0 0 4px rgba(27,77,143,0.25);"></div>`,
          className: "", iconSize: [16, 16], iconAnchor: [8, 8],
        });
        userMarkerRef.current = window.L.marker([latitude, longitude], { icon }).addTo(map);
        map.setView([latitude, longitude], 15);
      },
      (err) => { setLocating(false); setLocateErr("Position indisponible — autorise l'accès à la localisation."); },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  };

  return (
    <div className="relative w-full overflow-hidden rounded-2xl" style={{ height, border: `1px solid ${T.line}` }}>
      <div ref={mapDivRef} style={{ width: "100%", height: "100%" }} />
      {showLocateButton && (
        <button onClick={locateMe} disabled={locating}
          className="absolute top-2 right-2 rounded-full px-2.5 py-1.5 text-xs font-semibold shadow"
          style={{ background: "var(--card)", color: T.navy, zIndex: 1000 }}>
          {locating ? "…" : "📍 Ma position"}
        </button>
      )}
      {locateErr && (
        <div className="absolute bottom-2 left-2 right-2 px-2 py-1 rounded-md text-[10px] font-medium" style={{ background: "rgba(255,255,255,0.95)", color: T.orange, zIndex: 1000 }}>
          {locateErr}
        </div>
      )}
    </div>
  );
}

  const EDIT_WINDOW_MS = 24 * 60 * 60 * 1000;

  const load = async () => {
    const rows = await api.fetchReviews(provider.id);
    setReviews(rows);
    if (session) {
      const mine = rows.find((r) => r.user_id === session.user.id);
      setMyReview(mine || null);
      if (mine) { setMyRating(mine.rating); setMyComment(mine.comment || ""); }
    }
  };

  useEffect(() => { load(); }, [provider.id]);

  const editableUntil = myReview ? new Date(myReview.created_at).getTime() + EDIT_WINDOW_MS : null;
  const canEdit = !myReview || Date.now() < editableUntil;

  const submit = async () => {
    if (!session) { setShowAuth(true); return; }
    if (!myRating || !canEdit) return;
    setBusy(true);
    await api.upsertReview(provider.id, session.user.id, myRating, myComment);
    setBusy(false);
    load();

            <div style={{ marginTop: 8 }}><Skeleton width="85%" height={10} /></div>
          </div>
        ))}
      </div>
    );
  }

  return (
    <div>
      <div className="text-xs mb-2" style={{ color: T.mute }}>{reviews.length} avis</div>
      <div className="space-y-2 mb-3">
        {reviews.length === 0 && <div className="text-xs" style={{ color: T.mute }}>Aucun avis pour l'instant.</div>}
        {reviews.map((r) => (
          <div key={r.id} className="rounded-2xl p-3" style={{ background: "var(--card)", boxShadow: T.shadow }}>
            <div className="flex items-center gap-2">
              <div className="rounded-full flex items-center justify-center font-bold text-white" style={{ width: 30, height: 30, background: T.blue, fontSize: 12, flexShrink: 0 }}>
                {(r.profiles?.full_name || "U")[0].toUpperCase()}

              <div className="flex-1 min-w-0">

                <div className="mt-0.5"><StarRow rating={r.rating} size={10} /></div>

            </div>
            {r.comment && <p className="text-xs mt-2" style={{ color: T.ink }}>{r.comment}</p>}
          </div>
        ))}
      </div>

      {showAuth ? (
        <AuthForm onDone={() => { setShowAuth(false); load(); }} />
      ) : myReview && !canEdit ? (
        <div className="rounded-xl p-3" style={{ background: "var(--card)", border: `1px solid ${T.line}` }}>
          <div className="text-xs font-semibold mb-1.5" style={{ color: T.ink }}>Votre avis</div>
          <StarRow rating={myReview.rating} size={16} />

          <p className="text-[10px] mt-2" style={{ color: T.mute }}>La modification n'est possible que dans les 24h suivant la publication.</p>

          <div className="text-xs font-semibold mb-1.5" style={{ color: T.ink }}>{myReview ? "Modifier votre avis" : "Laisser un avis"}</div>
          {myReview && (
            <p className="text-[10px] mb-2" style={{ color: T.mute }}>Modifiable jusqu'à {new Date(editableUntil).toLocaleString("fr-FR")}</p>
          )}
          <div className="flex gap-1 mb-2">

  );

function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
function formatDistance(km) {
  return km.toFixed(1).replace(".", ",") + " km";
}

function ProviderCard({ p, categories, onOpen, userLoc }) {
  const c2 = categories.find((c) => c.id === p.category_id) || {};
  const distance = userLoc && p.lat && p.lng ? haversineKm(userLoc.lat, userLoc.lng, p.lat, p.lng) : null;
  return (
    <button onClick={() => onOpen(p)} className="w-full rounded-2xl p-3 text-left" style={{ background: "var(--card)", boxShadow: T.shadow }}>
      <div className="flex gap-3">
        <div className="relative" style={{ flexShrink: 0 }}>
          <PhotoOrAvatar photoUrl={p.photo_url} name={p.name} size={72} color={c2.color} />
          {p.verified_field && (
            <div className="absolute -bottom-1 left-1/2 -translate-x-1/2 flex items-center gap-0.5 rounded-full font-bold whitespace-nowrap" style={{ background: T.green, color: "#fff", fontSize: 8.5, padding: "1.5px 7px 1.5px 5px" }}>
              <Icon name="checkCircle" size={9} color="#fff" filled /> Vérifié
            </div>
          )}
        </div>
        <div className="flex-1 min-w-0 pt-0.5">
          <div className="font-bold text-sm truncate" style={{ color: T.ink }}>{p.name}</div>
          <div className="text-[11px] truncate" style={{ color: T.mute }}>{c2.label}</div>
          <div className="flex items-center gap-1 text-xs mt-1" style={{ color: T.ink }}>
            <Icon name="star" size={13} color={T.gold} filled /><span className="font-semibold">{p.rating}</span>
            <span style={{ color: T.mute }}>({p.reviews_count} avis)</span>
          </div>
          <div className="flex items-center justify-between mt-0.5">
            <div className="flex items-center gap-1 text-[11px] truncate" style={{ color: T.mute }}>
              <Icon name="mapPin" size={12} color={T.mute} /> {p.zone}, Dabakala
            </div>
            {distance !== null && (
              <span className="text-[11px] font-bold" style={{ color: T.blue, flexShrink: 0 }}>{formatDistance(distance)}</span>
            )}
          </div>
        </div>
      </div>
      <div className="grid grid-cols-2 gap-2 mt-3">
        <a href={`tel:${p.phone}`} onClick={(e) => e.stopPropagation()} className="flex items-center justify-center gap-1.5 rounded-xl py-2 text-xs font-bold" style={{ border: `1.5px solid ${T.blue}`, color: T.blue }}>
          <Icon name="phone" size={14} color={T.blue} /> Appeler
        </a>
        <a href={`https://wa.me/225${p.whatsapp || p.phone}`} onClick={(e) => e.stopPropagation()} target="_blank" rel="noreferrer" className="flex items-center justify-center gap-1.5 rounded-xl py-2 text-xs font-bold text-white" style={{ background: T.green }}>
          <Icon name="chat" size={14} color="#fff" filled /> WhatsApp
        </a>
      </div>
    </button>
  );
}

function FavoritesView({ session, categories, onOpen }) {
  const [favs, setFavs] = useState(null);
  const [showAuth, setShowAuth] = useState(false);

  const load = async () => {
    if (!session) return;
    setFavs(await api.fetchFavoriteProviders(session.user.id));
  };

  useEffect(() => { load(); }, [session]);

  if (!session) {
    return (
      <div className="px-4 py-4">
        {showAuth ? (
          <AuthForm onDone={() => setShowAuth(false)} />
        ) : (
          <div className="rounded-xl p-4 text-center" style={{ background: "var(--card)", border: `1px solid ${T.line}` }}>
            <div className="text-2xl mb-2">🤍</div>
            <p className="text-sm mb-3" style={{ color: T.mute }}>Connecte-toi pour retrouver tes prestataires favoris.</p>
            <button onClick={() => setShowAuth(true)} className="rounded-xl px-4 py-2 text-xs font-semibold text-white" style={{ background: T.navy }}>Se connecter</button>
          </div>
        )}
      </div>
    );
  }

  return (
    <div className="px-4 py-4">
      <div className="text-sm font-bold mb-2" style={{ color: T.ink }}>Mes favoris {favs ? `(${favs.length})` : ""}</div>
      {favs === null && <div className="space-y-3"><ProviderCardSkeleton /><ProviderCardSkeleton /></div>}
      {favs && favs.length === 0 && (
        <div className="text-sm text-center py-8" style={{ color: T.mute }}>
          Aucun favori pour l'instant — appuie sur 🤍 sur une fiche prestataire pour l'ajouter ici.
        </div>
      )}
      <div className="space-y-2">
        {favs && favs.map((p) => <ProviderCard key={p.id} p={p} categories={categories} onOpen={onOpen} />)}
      </div>
    </div>
  );
}

function ServicesTab({ provider }) {
  const [services, setServices] = useState(null);
  useEffect(() => { api.fetchServices(provider.id).then(setServices); }, [provider.id]);

  if (services === null) return (
    <div className="flex gap-2.5 overflow-x-auto">
      {[1, 2, 3].map((i) => <Skeleton key={i} width={84} height={70} radius={16} />)}
    </div>
  );
  if (services.length === 0) return <div className="text-xs" style={{ color: T.mute }}>Aucun service détaillé pour l'instant — voir le tarif indicatif ci-dessus.</div>;

  return (
    <div className="flex gap-2.5 overflow-x-auto" style={{ scrollbarWidth: "none" }}>
      {services.map((s) => (
        <div key={s.id} className="flex flex-col items-center justify-center rounded-2xl text-center" style={{ background: "var(--card)", boxShadow: T.shadow, minWidth: 84, padding: "12px 8px", flexShrink: 0 }}>
          <Icon name={iconForCategory(provider.category_id)} size={22} color={T.orange} strokeWidth={1.8} />
          <span className="text-[11px] font-semibold mt-1 leading-tight" style={{ color: T.ink }}>{s.name}</span>
          {s.price_text && <span className="text-[10px] mt-0.5" style={{ color: T.orange, fontWeight: 700 }}>{s.price_text}</span>}
        </div>
      ))}
    </div>
  );
}

function PhotosTab({ provider }) {
  const [photos, setPhotos] = useState(null);
  const [lightbox, setLightbox] = useState(null);
  useEffect(() => { api.fetchGalleryPhotos(provider.id).then(setPhotos); }, [provider.id]);

  const all = [
    ...(provider.photo_url ? [{ id: "main", photo_url: provider.photo_url }] : []),
    ...(photos || []),
  ];

  if (photos === null) return (
    <div className="flex gap-2 overflow-x-auto">
      {[1, 2, 3].map((i) => <Skeleton key={i} width={110} height={110} radius={16} />)}
    </div>
  );
  if (all.length === 0) return <div className="text-xs" style={{ color: T.mute }}>Aucune photo pour l'instant.</div>;

  return (
    <div>
      <div className="flex gap-2 overflow-x-auto" style={{ scrollbarWidth: "none" }}>
        {all.map((p) => (
          <button key={p.id} onClick={() => setLightbox(p.photo_url)} className="rounded-2xl overflow-hidden" style={{ width: 110, height: 110, flexShrink: 0, boxShadow: T.shadow }}>
            <img src={p.photo_url} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
          </button>
        ))}
      </div>
      {lightbox && (
        <div onClick={() => setLightbox(null)} className="fixed inset-0 flex items-center justify-center p-4" style={{ background: "rgba(0,0,0,0.85)", zIndex: 2000 }}>
          <img src={lightbox} alt="" style={{ maxWidth: "100%", maxHeight: "100%", borderRadius: 8 }} />
        </div>
      )}
    </div>
  );
}

function ProviderSheet({ provider, categories, session, onBack }) {
  const cat = categories.find((c) => c.id === provider.category_id) || {};
  const [fav, setFav] = useState(false);
  const [showAuth, setShowAuth] = useState(false);
  const [shareMsg, setShareMsg] = useState("");

  useEffect(() => {
    if (session) api.isFavorite(provider.id, session.user.id).then(setFav);
  }, [provider.id, session]);

  const toggleFav = async () => {
    if (!session) { setShowAuth(true); return; }
    await api.setFavorite(provider.id, session.user.id, !fav);
    setFav(!fav);
  };

  const shareProvider = async () => {
    const url = `${window.location.origin}${window.location.pathname}?prestataire=${provider.id}`;
    const text = `${provider.name} — ${cat.label || ""} à Dabakala. ${provider.phone}`;
    if (navigator.share) {
      try { await navigator.share({ title: provider.name, text, url }); } catch (e) { /* annulé par l'utilisateur */ }
      return;
    }
    try {
      await navigator.clipboard.writeText(url);
      setShareMsg("Lien copié !");
    } catch (e) {
      setShareMsg(url);
    }
    setTimeout(() => setShareMsg(""), 2500);
  };

  const RoundBtn = ({ children, onClick, filled }) => {
    const style = { width: 38, height: 38, borderRadius: 999, background: filled ? "#fff" : "rgba(255,255,255,0.9)", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 2px 6px rgba(0,0,0,0.2)" };
    return <button onClick={onClick} style={style}>{children}</button>;
  };

  return (
    <div className="flex flex-col h-full" style={{ background: T.bg }}>
      <div className="flex-1 overflow-y-auto">
        {/* Hero */}
        <div className="relative" style={{ height: 190 }}>
          {provider.photo_url ? (
            <img src={provider.photo_url} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
          ) : (
            <div style={{ width: "100%", height: "100%", background: `linear-gradient(135deg, ${cat.color || T.navy} 0%, ${T.navy} 100%)`, display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Icon name={cat.icon || iconForCategory(provider.category_id)} size={56} color="rgba(255,255,255,0.9)" strokeWidth={1.4} />
            </div>
          )}
          <div className="absolute inset-x-0 top-0 flex items-center justify-between p-4">
            <button onClick={onBack} style={{ width: 38, height: 38, borderRadius: 999, background: "rgba(255,255,255,0.9)", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 2px 6px rgba(0,0,0,0.2)" }}>
              <Icon name="chevronLeft" size={20} color={T.ink} />
            </button>
            <div className="flex gap-2">
              <RoundBtn onClick={shareProvider}><Icon name="share" size={16} color={T.ink} /></RoundBtn>
              <RoundBtn onClick={toggleFav}><Icon name="heart" size={17} color={fav ? "#E23744" : T.ink} filled={fav} /></RoundBtn>
            </div>
          </div>
          {shareMsg && (
            <div className="absolute bottom-2 left-1/2 -translate-x-1/2 px-3 py-1 rounded-full text-[11px] font-semibold" style={{ background: T.gold, color: T.navyDeep }}>
              {shareMsg}
            </div>
          )}
        </div>

        {/* Carte imbriquée */}
        <div className="relative -mt-5 rounded-t-3xl px-4 pt-4 pb-2" style={{ background: T.bg }}>
          <div className="flex gap-3 items-start">
            <div className="rounded-2xl flex items-center justify-center" style={{ width: 56, height: 56, background: "var(--card)", boxShadow: T.shadow, flexShrink: 0, marginTop: -28 }}>
              <Icon name={cat.icon || iconForCategory(provider.category_id)} size={26} color={cat.color || T.navy} />
            </div>
            <div className="flex-1 min-w-0 pt-1">
              <div className="flex items-center gap-1.5">
                <h2 className="text-lg font-bold truncate" style={{ color: T.ink }}>{provider.name}</h2>
                {provider.validated && <Icon name="checkCircle" size={16} color={T.blue} filled />}
              </div>
              <div className="text-xs" style={{ color: T.mute }}>{cat.label}</div>
            </div>
          </div>

          <div className="flex items-center gap-2 mt-2">
            <Icon name="star" size={14} color={T.gold} filled />
            <span className="text-sm font-bold" style={{ color: T.ink }}>{provider.rating}</span>
            <span className="text-xs" style={{ color: T.mute }}>({provider.reviews_count} avis)</span>
            {provider.verified_field && (
              <span className="ml-1 flex items-center gap-1 rounded-full font-semibold" style={{ background: "#EAF7EF", color: T.greenDeep, fontSize: 10.5, padding: "2px 8px" }}>
                <Icon name="shieldCheck" size={11} color={T.greenDeep} /> Vérifié terrain
              </span>
            )}
          </div>

          <div className="grid grid-cols-3 gap-2 mt-3">
            <div className="rounded-xl p-2 text-center" style={{ background: "var(--card)", boxShadow: T.shadow }}>
              <div className="flex justify-center"><Icon name="mapPin" size={17} color={T.blue} /></div>
              <div className="text-[10px] font-semibold mt-0.5 truncate" style={{ color: T.ink }}>{provider.zone}</div>
              <div className="text-[9px]" style={{ color: T.mute }}>Zone</div>
            </div>
            <div className="rounded-xl p-2 text-center" style={{ background: "var(--card)", boxShadow: T.shadow }}>
              <div className="flex justify-center"><Icon name="wallet" size={17} color={T.orange} /></div>
              <div className="text-[10px] font-semibold mt-0.5 truncate" style={{ color: T.ink }}>{provider.price_text || "—"}</div>
              <div className="text-[9px]" style={{ color: T.mute }}>Tarif indicatif</div>
            </div>
            <div className="rounded-xl p-2 text-center" style={{ background: "var(--card)", boxShadow: T.shadow }}>
              <div className="flex justify-center"><Icon name={provider.validated ? "checkCircle" : "clock"} size={17} color={provider.validated ? T.greenDeep : T.gold} /></div>
              <div className="text-[10px] font-semibold mt-0.5" style={{ color: T.ink }}>{provider.validated ? "Validé" : "En attente"}</div>
              <div className="text-[9px]" style={{ color: T.mute }}>Statut</div>
            </div>
          </div>
        </div>

        <div className="px-4 pb-4 space-y-5">
          <div>
            <div className="text-sm font-bold mb-1.5" style={{ color: T.ink }}>À propos</div>
            <p className="text-sm leading-relaxed" style={{ color: T.ink }}>{provider.description || "Aucune description pour l'instant."}</p>
          </div>

          {provider.lat && provider.lng && (
            <div>
              <div className="text-sm font-bold mb-1.5" style={{ color: T.ink }}>Localisation</div>
              <RealMap providers={[provider]} selectedId={provider.id} onSelect={() => {}} height={150} />
              <a href={`https://www.google.com/maps/dir/?api=1&destination=${provider.lat},${provider.lng}`} target="_blank" rel="noreferrer"
                className="mt-2 w-full flex items-center justify-center gap-2 rounded-xl py-2 text-xs font-bold" style={{ background: "var(--card)", border: `1.5px solid ${T.blue}`, color: T.blue }}>
                <Icon name="mapPin" size={14} color={T.blue} /> Itinéraire
              </a>
            </div>
          )}

          <div>
            <div className="flex items-center justify-between mb-1.5">
              <span className="text-sm font-bold" style={{ color: T.ink }}>Services proposés</span>
            </div>
            <ServicesTab provider={provider} />
          </div>

          <div>
            <div className="text-sm font-bold mb-1.5" style={{ color: T.ink }}>Réalisations</div>
            <PhotosTab provider={provider} />
          </div>

          <div>
            <div className="text-sm font-bold mb-1.5" style={{ color: T.ink }}>Avis clients</div>
            {showAuth ? <AuthForm onDone={() => setShowAuth(false)} /> : <ReviewsSection provider={provider} session={session} />}
          </div>
        </div>
      </div>
      <div className="px-4 py-3 grid grid-cols-2 gap-2.5" style={{ background: "var(--card)", borderTop: `1px solid ${T.line}` }}>
        <a href={`tel:${provider.phone}`} className="flex items-center justify-center gap-2 rounded-2xl py-3.5 font-bold text-base" style={{ border: `1.5px solid ${T.blue}`, color: T.blue }}><Icon name="phone" size={17} color={T.blue} /> Appeler</a>
        <a href={`https://wa.me/225${provider.whatsapp || provider.phone}`} target="_blank" rel="noreferrer" className="flex items-center justify-center gap-2 rounded-2xl py-3.5 font-bold text-base text-white" style={{ background: T.green }}><Icon name="chat" size={17} color="#fff" filled /> WhatsApp</a>
      </div>
    </div>
  );
}

function ProfileRow({ icon, title, subtitle, value, danger, onClick }) {
  return (
    <button onClick={onClick} className="w-full flex items-center gap-3 px-3.5 py-3 text-left" style={{ borderBottom: `1px solid ${T.line}` }}>
      <Icon name={icon} size={18} color={danger ? "#B3261E" : T.mute} />
      <div className="flex-1 min-w-0">
        <div className="text-sm font-semibold" style={{ color: danger ? "#B3261E" : T.ink }}>{title}</div>
        {subtitle && <div className="text-[11px]" style={{ color: T.mute }}>{subtitle}</div>}
      </div>
      {value && <span className="text-xs" style={{ color: T.mute }}>{value}</span>}
      {!danger && <Icon name="chevronRight" size={16} color={T.mute} />}
    </button>
  );
}

function ProfileSubScreen({ title, onBack, children }) {
  return (
    <div className="h-full flex flex-col" style={{ background: T.bg }}>
      <div className="flex items-center gap-3 px-4 py-3" style={{ background: "var(--card)", borderBottom: `1px solid ${T.line}` }}>
        <button onClick={onBack} style={{ color: T.ink }}><Icon name="chevronLeft" size={22} /></button>
        <span className="font-bold text-sm" style={{ color: T.ink }}>{title}</span>
      </div>
      <div className="flex-1 overflow-y-auto px-4 py-4">{children}</div>
    </div>
  );
}

function ProfileTab({ session, onProposeService, theme, setTheme, onNavigate }) {
  const [showAuth, setShowAuth] = useState(false);
  const [profile, setProfile] = useState(null);
  const [favCount, setFavCount] = useState(null);
  const [myProviders, setMyProviders] = useState([]);
  const [myReviews, setMyReviews] = useState(null);
  const [subView, setSubView] = useState(null); // null | "avis" | "infos" | "apropos"
  const [nameInput, setNameInput] = useState("");
  const [savingName, setSavingName] = useState(false);

  const load = () => {
    if (!session) return;
    api.getProfile(session.user.id).then((p) => { setProfile(p); setNameInput(p?.full_name || ""); });
    api.fetchFavoriteProviders(session.user.id).then((f) => setFavCount(f.length));
    api.fetchProviders().then((all) => setMyProviders(all.filter((p) => p.added_by === session.user.id)));
    api.fetchMyReviews(session.user.id).then(setMyReviews);
  };
  useEffect(load, [session]);

  if (!session) {
    return (
      <div className="h-full flex flex-col items-center justify-center px-6" style={{ background: T.bg }}>
        <button onClick={() => setTheme(theme === "dark" ? "light" : "dark")} className="w-full flex items-center justify-between rounded-2xl p-3.5 mb-4" style={{ background: "var(--card)", boxShadow: T.shadow }}>
          <div className="flex items-center gap-2.5">
            <Icon name={theme === "dark" ? "moon" : "sun"} size={17} color={T.navy} />
            <span className="text-sm font-semibold" style={{ color: T.ink }}>Mode sombre</span>
          </div>
          <div style={{ width: 40, height: 22, borderRadius: 999, background: theme === "dark" ? T.navy : T.line, position: "relative", flexShrink: 0 }}>
            <div style={{ width: 18, height: 18, borderRadius: 999, background: "#fff", position: "absolute", top: 2, left: theme === "dark" ? 20 : 2, transition: "left 0.15s ease" }} />
          </div>
        </button>
        {showAuth ? (
          <div className="w-full"><AuthForm onDone={() => setShowAuth(false)} /></div>
        ) : (
          <div className="w-full rounded-2xl p-6 text-center" style={{ background: "var(--card)", boxShadow: T.shadow }}>
            <div className="mx-auto rounded-full flex items-center justify-center mb-3" style={{ width: 56, height: 56, background: T.bg }}>
              <Icon name="user" size={26} color={T.navy} />
            </div>
            <p className="text-sm mb-4" style={{ color: T.mute }}>Connecte-toi pour gérer ton profil, tes avis et tes favoris.</p>
            <button onClick={() => setShowAuth(true)} className="rounded-xl px-5 py-2.5 text-sm font-bold text-white" style={{ background: T.navy }}>Se connecter</button>
          </div>
        )}
      </div>
    );
  }

  const name = profile?.full_name || session.user.email;

  if (subView === "avis") {
    return (
      <ProfileSubScreen title="Mes avis" onBack={() => setSubView(null)}>
        {myReviews === null ? (
          <div className="space-y-2">{[1, 2].map((i) => <Skeleton key={i} height={60} radius={16} />)}</div>
        ) : myReviews.length === 0 ? (
          <div className="text-sm text-center py-8" style={{ color: T.mute }}>Tu n'as encore laissé aucun avis.</div>
        ) : (
          <div className="space-y-2">
            {myReviews.map((r) => (
              <div key={r.id} className="rounded-2xl p-3" style={{ background: "var(--card)", boxShadow: T.shadow }}>
                <div className="font-bold text-sm" style={{ color: T.ink }}>{r.providers ? r.providers.name : "Prestataire"}</div>
                <div className="mt-1"><StarRow rating={r.rating} size={12} /></div>
                {r.comment && <p className="text-xs mt-1.5" style={{ color: T.mute }}>{r.comment}</p>}
                <div className="text-[10px] mt-1.5" style={{ color: T.mute }}>{timeAgo(r.created_at)}</div>
              </div>
            ))}
          </div>
        )}
      </ProfileSubScreen>
    );
  }

  if (subView === "infos") {
    return (
      <ProfileSubScreen title="Informations personnelles" onBack={() => setSubView(null)}>
        <div className="rounded-2xl p-4" style={{ background: "var(--card)", boxShadow: T.shadow }}>
          <label className="text-xs font-semibold" style={{ color: T.mute }}>Nom complet</label>
          <input value={nameInput} onChange={(e) => setNameInput(e.target.value)} className="w-full mt-1 rounded-lg px-3 py-2 text-sm outline-none" style={{ background: T.bg, border: `1px solid ${T.line}`, color: T.ink }} />
          <label className="text-xs font-semibold mt-3 block" style={{ color: T.mute }}>Email</label>
          <div className="w-full mt-1 rounded-lg px-3 py-2 text-sm" style={{ background: T.bg, color: T.mute }}>{session.user.email}</div>
          <button onClick={async () => { setSavingName(true); await api.updateFullName(session.user.id, nameInput); setSavingName(false); load(); setSubView(null); }}
            disabled={savingName} className="w-full mt-4 rounded-xl py-2.5 font-bold text-white" style={{ background: T.navy, opacity: savingName ? 0.6 : 1 }}>
            {savingName ? "…" : "Enregistrer"}
          </button>
        </div>
      </ProfileSubScreen>
    );
  }

  if (subView === "apropos") {
    return (
      <ProfileSubScreen title="À propos" onBack={() => setSubView(null)}>
        <div className="rounded-2xl p-4 text-center" style={{ background: "var(--card)", boxShadow: T.shadow }}>
          <div className="font-extrabold text-base mb-1" style={{ color: T.navy }}>Dabakala <span style={{ color: T.orange }}>Services</span></div>
          <div className="text-xs mb-3" style={{ color: T.mute }}>Version 1.0.0</div>
          <p className="text-sm leading-relaxed" style={{ color: T.ink }}>
            Le rendez-vous des services de confiance à Dabakala. Une plateforme locale qui connecte les habitants aux prestataires de la ville — plomberie, beauté, transport, informatique et bien plus.
          </p>
        </div>
      </ProfileSubScreen>
    );
  }

  return (
    <div className="h-full overflow-y-auto px-4 py-5" style={{ background: T.bg }}>

function UserHome({ providers, categories, session, onOpen, userTab, onNavigate, onProposeService, theme, setTheme }) {
  const [query, setQuery] = useState("");
  const [cat, setCat] = useState(null);
  const [mode, setMode] = useState("list");
  const [selected, setSelected] = useState(null);
  const [showFilters, setShowFilters] = useState(false);
  const [zone, setZone] = useState("");
  const [minRating, setMinRating] = useState(0);
  const [verifiedOnly, setVerifiedOnly] = useState(false);
  const [sortBy, setSortBy] = useState("pertinence");
  const [userLoc, setUserLoc] = useState(null);
  const [showAllCats, setShowAllCats] = useState(false);

  useEffect(() => {
    if (!navigator.geolocation) return;
    navigator.geolocation.getCurrentPosition(
      (pos) => setUserLoc({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
      () => {},
      { enableHighAccuracy: false, timeout: 6000 }
    );
  }, []);

  const activeFilterCount = (zone ? 1 : 0) + (minRating > 0 ? 1 : 0) + (verifiedOnly ? 1 : 0) + (cat ? 1 : 0);
  const availableZones = useMemo(
    () => [...new Set(providers.filter((p) => p.validated && p.zone).map((p) => p.zone))].sort(),
    [providers]
  );

  const resetFilters = () => { setZone(""); setMinRating(0); setVerifiedOnly(false); setSortBy("pertinence"); };

  const visible = useMemo(() => {
    const q = query.toLowerCase();
    let rows = providers
      .filter((p) => p.validated)
      .filter((p) => (cat ? p.category_id === cat : true))
      .filter((p) => (zone ? p.zone === zone : true))
      .filter((p) => (minRating ? p.rating >= minRating : true))
      .filter((p) => (verifiedOnly ? p.verified_field : true))
      .filter((p) => !q || p.name.toLowerCase().includes(q) || (p.description || "").toLowerCase().includes(q));

    if (sortBy === "rating") rows = [...rows].sort((a, b) => b.rating - a.rating);
    else if (sortBy === "reviews") rows = [...rows].sort((a, b) => b.reviews_count - a.reviews_count);
    else if (sortBy === "az") rows = [...rows].sort((a, b) => a.name.localeCompare(b.name));

    return rows;
  }, [providers, cat, query, zone, minRating, verifiedOnly, sortBy]);

  const popular = useMemo(() => {
    return providers.filter((p) => p.validated).slice().sort((a, b) => b.rating - a.rating || b.reviews_count - a.reviews_count).slice(0, 6);
  }, [providers]);

  const goSearch = () => { setQuery(""); };

  if (userTab === "favorites") {
    return (
      <div className="h-full overflow-y-auto" style={{ background: T.bg }}>
        <FavoritesView session={session} categories={categories} onOpen={onOpen} />

    );

  if (userTab === "profile") {
    return <ProfileTab session={session} onProposeService={onProposeService} theme={theme} setTheme={setTheme} onNavigate={onNavigate} />;
  }

  if (userTab === "home") {
    const nearby = providers.filter((p) => p.validated).slice(0, 5);
    return (
      <div className="h-full overflow-y-auto" style={{ background: T.bg }}>
        <div className="px-4 pt-4 pb-1">
          <div className="text-sm" style={{ color: T.mute }}>Bonjour 👋</div>
          <div className="font-extrabold text-lg" style={{ color: T.ink }}>Que recherchez-vous ?</div>
          <div className="mt-2.5 flex items-center gap-2 rounded-xl px-3 py-2.5" style={{ background: "var(--card)", border: `1px solid ${T.line}` }}
            onClick={() => onNavigate && onNavigate("search")}>
            <Icon name="search" size={16} color={T.mute} />
            <input value={query} onChange={(e) => setQuery(e.target.value)} onFocus={() => onNavigate && onNavigate("search")} placeholder="Rechercher un service, un prestataire…" className="flex-1 text-sm outline-none bg-transparent" style={{ color: T.ink }} />
          </div>
        </div>
        <div className="px-4 py-4 space-y-5">
          <BannerCarousel />
          <div>
            <div className="flex items-center justify-between mb-2">
              <span className="text-sm font-bold" style={{ color: T.ink }}>Catégories</span>
              <button onClick={() => setShowAllCats((v) => !v)} className="text-xs font-semibold" style={{ color: T.blue }}>
                {showAllCats ? "Réduire" : "Voir tout"}
              </button>
            </div>
            <div className="grid grid-cols-3 gap-2.5">
              {(showAllCats ? categories : categories.slice(0, 6)).map((c) => (
                <CategoryTile key={c.id} cat={c} active={cat === c.id} onClick={() => { setCat(cat === c.id ? null : c.id); onNavigate && onNavigate("search"); }} />
              ))}
            </div>
          </div>
          <div>
            <div className="flex items-center justify-between mb-2">
              <span className="text-sm font-bold" style={{ color: T.ink }}>Prestataires populaires</span>

                      <div className="font-bold text-xs mt-2 truncate" style={{ color: T.ink }}>{p.name}</div>
                      <div className="text-[10px] truncate" style={{ color: T.mute }}>{c2.label}</div>
                      <div className="flex items-center gap-1 text-[11px] mt-1"><Icon name="star" size={11} color={T.gold} filled /><span className="font-semibold" style={{ color: T.ink }}>{p.rating}</span></div>
                    </button>

            )}
          </div>
          <div>
            <div className="flex items-center justify-between mb-2">
              <span className="text-sm font-bold" style={{ color: T.ink }}>Services près de vous</span>
              <button onClick={() => onNavigate && onNavigate("search")} className="text-xs font-semibold" style={{ color: T.blue }}>Voir tout</button>
            </div>
            {nearby.length === 0 ? (
              <div className="text-sm" style={{ color: T.mute }}>Aucun prestataire validé pour l'instant.</div>
            ) : (
              <div className="space-y-3">
                {nearby.map((p) => <ProviderCard key={p.id} p={p} categories={categories} onOpen={onOpen} userLoc={userLoc} />)}

          </div>
        </div>
      </div>
    );
  }

  /* userTab === "search" */
  return (
    <div className="flex flex-col h-full" style={{ background: T.bg }}>
      <div className="px-4 pt-4 pb-3" style={{ background: "var(--card)", borderBottom: `1px solid ${T.line}` }}>
        <div className="font-extrabold text-base mb-2" style={{ color: T.ink }}>Recherche</div>
        <div className="flex items-center gap-2">
          <div className="flex-1 flex items-center gap-2 rounded-xl px-3 py-2.5" style={{ background: T.bg, border: `1px solid ${T.line}` }}>
            <Icon name="search" size={16} color={T.mute} />
            <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Rechercher un service, un prestataire…" className="flex-1 text-sm outline-none bg-transparent" style={{ color: T.ink }} />
          </div>
          <button onClick={() => setShowFilters((v) => !v)} className="rounded-xl flex items-center justify-center relative" style={{ width: 42, height: 42, background: T.blue, flexShrink: 0 }}>
            <Icon name="sliders" size={17} color="#fff" />
            {activeFilterCount > 0 && (
              <span className="absolute rounded-full font-bold" style={{ top: -3, right: -3, background: T.orange, color: "#fff", fontSize: 9, padding: "1px 4px" }}>{activeFilterCount}</span>

        </div>
        <div className="mt-2 text-xs" style={{ color: T.mute }}>
          {query ? (

          ) : (
            <><span className="font-bold" style={{ color: T.navy }}>{visible.length}</span> prestataire{visible.length !== 1 ? "s" : ""} disponible{visible.length !== 1 ? "s" : ""}</>
          )}
        </div>
        <div className="mt-2.5 flex gap-2">
          {[["list", "Liste"], ["map", "Carte"]].map(([id, label]) => (
            <button key={id} onClick={() => setMode(id)} className="flex-1 rounded-lg py-1.5 text-xs font-semibold"
              style={{ background: mode === id ? T.navy : T.bg, color: mode === id ? "#fff" : T.mute, border: `1px solid ${mode === id ? T.navy : T.line}` }}>
              {label}
            </button>
          ))}
        </div>
        {showFilters && (
          <div className="mt-3 rounded-xl p-3 space-y-2" style={{ background: T.bg, border: `1px solid ${T.line}` }}>
            <div>
              <label className="text-[10px] font-semibold" style={{ color: T.mute }}>Zone</label>
              <select value={zone} onChange={(e) => setZone(e.target.value)} className="w-full mt-0.5 rounded-lg px-2 py-1.5 text-xs outline-none" style={{ background: "var(--card)", border: `1px solid ${T.line}` }}>
                <option value="">Toutes les zones</option>
                {availableZones.map((z) => <option key={z} value={z}>{z}</option>)}

            </div>
            <div>
              <label className="text-[10px] font-semibold" style={{ color: T.mute }}>Catégorie</label>

              <label className="text-[10px] font-semibold" style={{ color: T.mute }}>Note minimum</label>
              <div className="flex gap-1 mt-0.5">
                {[0, 3, 4, 4.5].map((n) => (
                  <button key={n} onClick={() => setMinRating(n)} className="flex-1 rounded-lg py-1.5 text-[11px] font-semibold"
                    style={{ background: minRating === n ? T.gold : "#fff", border: `1px solid ${T.line}`, color: T.ink }}>

            <div>

function ProviderExtrasManager({ provider, onClose }) {
  const [tab, setTab] = useState("services");
  const [services, setServices] = useState([]);
  const [photos, setPhotos] = useState([]);
  const [newName, setNewName] = useState("");
  const [newPrice, setNewPrice] = useState("");
  const [photoFile, setPhotoFile] = useState(null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");

  const load = async () => {
    setServices(await api.fetchServices(provider.id));
    setPhotos(await api.fetchGalleryPhotos(provider.id));
  };
  useEffect(() => { load(); }, [provider.id]);

  const addService = async () => {
    if (!newName.trim()) return;
    setBusy(true);
    const { error } = await api.addService(provider.id, newName.trim(), newPrice.trim(), services.length);
    setBusy(false);
    if (error) { setErr(error.message); return; }
    setNewName(""); setNewPrice(""); load();
  };
  const removeService = async (id) => { await api.deleteService(id); load(); };

  const addPhoto = async () => {
    if (!photoFile) return;
    setBusy(true); setErr("");
    try {
      const url = await api.uploadPhoto(photoFile);
      const { error } = await api.addGalleryPhoto(provider.id, url, photos.length);
      if (error) throw error;
      setPhotoFile(null);
      load();
    } catch (e) { setErr(e.message || "Erreur"); }
    setBusy(false);
  };
  const removePhoto = async (id) => { await api.deleteGalleryPhoto(id); load(); };

  return (
    <div className="rounded-xl p-3 space-y-3" style={{ background: "var(--card)", border: `1px solid ${T.line}` }}>
      <div className="flex items-center justify-between">
        <span className="text-xs font-bold" style={{ color: T.ink }}>Services &amp; photos — {provider.name}</span>
        <button onClick={onClose} className="text-xs font-semibold" style={{ color: T.mute }}>Fermer</button>
      </div>
      <div className="flex gap-2">
        <button onClick={() => setTab("services")} className="flex-1 rounded-lg py-1.5 text-[11px] font-semibold" style={{ background: tab === "services" ? T.orange : T.cream, color: tab === "services" ? "#fff" : T.ink }}>Services</button>

function ProviderEditForm({ provider, categories, onSave, onCancel }) {
  const [form, setForm] = useState({

  const [coords, setCoords] = useState(provider.lat && provider.lng ? { lat: provider.lat, lng: provider.lng } : null);
  const [locating, setLocating] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  const setPhoneField = (k) => (e) => {
    const digits = e.target.value.replace(/\D/g, "").slice(0, 10);
    setForm((f) => ({ ...f, [k]: digits }));
  };
  const formatPriceOnBlur = (e) => {
    const v = e.target.value.trim();
    if (v && /^[\d\s]+$/.test(v)) {
      setForm((f) => ({ ...f, price_text: v + " FCFA" }));
    }
  };

  const recapture = () => {
    if (!navigator.geolocation) { setErr("Géolocalisation non supportée sur cet appareil."); return; }
    setLocating(true); setErr("");
    navigator.geolocation.getCurrentPosition(
      (pos) => { setLocating(false); setCoords({ lat: pos.coords.latitude, lng: pos.coords.longitude }); },
      () => { setLocating(false); setErr("Position indisponible."); },
      { enableHighAccuracy: true, timeout: 8000 }
    );
  };

  const save = async () => {
    if (!form.name || !form.phone) return;
    setBusy(true); setErr("");
    let payload = { ...form };
    if (coords) { payload.lat = coords.lat; payload.lng = coords.lng; }

      try { payload.photo_url = await api.uploadPhoto(photoFile); }
      catch (e) { setErr("Erreur photo : " + e.message); setBusy(false); return; }

    const { error } = await api.updateProvider(provider.id, payload);
    setBusy(false);
    if (error) { setErr(error.message); return; }
    onSave();
  };

  return (
    <div className="rounded-xl p-3 space-y-2" style={{ background: "var(--card)", border: `1px solid ${T.line}` }}>

        <label className="text-[10px] font-semibold" style={{ color: T.mute }}>Téléphone</label>

      </div>
      <div>
        <label className="text-[10px] font-semibold" style={{ color: T.mute }}>WhatsApp</label>
        <input value={form.whatsapp} onChange={setPhoneField("whatsapp")} inputMode="numeric" maxLength={10} className="w-full mt-0.5 rounded-lg px-2.5 py-1.5 text-xs outline-none" style={{ background: T.cream, border: `1px solid ${T.line}` }} />

function NotificationBell({ items, storageKey }) {
  const [open, setOpen] = useState(false);
  const [lastSeen, setLastSeen] = useState(() => localStorage.getItem(storageKey) || "1970-01-01T00:00:00Z");
  const unread = items.filter((i) => i.time > lastSeen).length;

  const markRead = () => {
    const now = new Date().toISOString();
    localStorage.setItem(storageKey, now);
    setLastSeen(now);
  };

  return (
    <div className="relative">
      <button onClick={() => { setOpen((o) => !o); if (!open) markRead(); }} style={{ position: "relative", fontSize: 18 }}>
        🔔
        {unread > 0 && (
          <span className="absolute rounded-full font-bold" style={{ top: -4, right: -6, background: T.orange, color: "#fff", fontSize: 9, padding: "1px 4px" }}>
            {unread}
          </span>
        )}
      </button>
      {open && (
        <div className="absolute right-0 mt-2 rounded-xl shadow-lg overflow-hidden" style={{ width: 260, maxHeight: 300, overflowY: "auto", background: "var(--card)", border: `1px solid ${T.line}`, zIndex: 50 }}>

    navigator.geolocation.getCurrentPosition(

function CategoryRow({ cat, onSaved }) {
  const [form, setForm] = useState({ label: cat.label, emoji: cat.emoji, color: cat.color, sort_order: cat.sort_order });
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const dirty = form.label !== cat.label || form.emoji !== cat.emoji || form.color !== cat.color || form.sort_order !== cat.sort_order;

  const save = async () => {
    setBusy(true); setErr("");
    const { error } = await api.updateCategory(cat.id, { ...form, sort_order: Number(form.sort_order) });
    setBusy(false);
    if (error) { setErr(error.message); return; }
    onSaved();

    if (error) { setErr("Suppression impossible : des prestataires utilisent encore cette catégorie."); return; }

  return (
    <div className="rounded-xl p-2.5" style={{ background: "var(--card)", border: `1px solid ${T.line}` }}>

        <input type="color" value={form.color} onChange={(e) => setForm((f) => ({ ...f, color: e.target.value }))}

function timeAgo(iso) {
  if (!iso) return "";
  const diffMs = Date.now() - new Date(iso).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "à l'instant";
  if (mins < 60) return `il y a ${mins} min`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `il y a ${hours} h`;
  const days = Math.floor(hours / 24);
  if (days < 30) return `il y a ${days} j`;
  return new Date(iso).toLocaleDateString("fr-FR");
}

function BarRow({ label, emoji, count, max, color }) {

      </div>
      <div className="w-full rounded-full h-2" style={{ background: T.line }}>
        <div className="h-2 rounded-full" style={{ width: `${pct}%`, background: color || T.orange }} />
      </div>
    </div>
  );
}

function StatsAdmin({ providers, categories }) {
  const total = providers.length;
  const validated = providers.filter((p) => p.validated).length;
  const pending = total - validated;
  const verifiedField = providers.filter((p) => p.verified_field).length;
  const totalReviews = providers.reduce((s, p) => s + (p.reviews_count || 0), 0);
  const ratedProviders = providers.filter((p) => p.reviews_count > 0);
  const avgRating = ratedProviders.length
    ? (ratedProviders.reduce((s, p) => s + p.rating, 0) / ratedProviders.length).toFixed(1)
    : "—";

  const byCategory = categories
    .map((c) => ({ ...c, count: providers.filter((p) => p.category_id === c.id).length }))
    .filter((c) => c.count > 0)
    .sort((a, b) => b.count - a.count);
  const maxCat = Math.max(1, ...byCategory.map((c) => c.count));

  const zonesCount = {};
  providers.forEach((p) => { zonesCount[p.zone] = (zonesCount[p.zone] || 0) + 1; });
  const byZone = Object.entries(zonesCount).sort((a, b) => b[1] - a[1]);
  const maxZone = Math.max(1, ...byZone.map(([, c]) => c));

  const recent = [...providers].sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).slice(0, 6);

  const KPI = ({ label, value, color }) => (
    <div className="rounded-lg px-2 py-2" style={{ background: "rgba(255,255,255,0.12)" }}>
      <div className="text-white text-lg font-bold" style={{ color: color }}>{value}</div>
      <div className="text-[10px]" style={{ color: "#C9D5EA" }}>{label}</div>
    </div>
  );

  return (
    <div className="flex-1 overflow-y-auto" style={{ background: T.cream }}>
      <div className="px-4 pt-3 pb-4" style={{ background: T.navy }}>
        <div className="grid grid-cols-3 gap-2">
          <KPI label="Prestataires" value={total} />
          <KPI label="Validés" value={validated} />
          <KPI label="En attente" value={pending} />
          <KPI label="Vérifiés terrain" value={verifiedField} />
          <KPI label="Avis totaux" value={totalReviews} />
          <KPI label="Note moyenne" value={avgRating} />
        </div>
      </div>

      <div className="px-4 py-4 space-y-5">
        <div>
          <div className="text-xs font-bold uppercase tracking-wide mb-2" style={{ color: T.mute }}>Par catégorie</div>
          {byCategory.length === 0 && <div className="text-xs" style={{ color: T.mute }}>Aucune donnée.</div>}
          {byCategory.map((c) => (
            <BarRow key={c.id} label={c.label} emoji={c.emoji} count={c.count} max={maxCat} color={c.color} />
          ))}
        </div>

        <div>
          <div className="text-xs font-bold uppercase tracking-wide mb-2" style={{ color: T.mute }}>Par zone</div>
          {byZone.length === 0 && <div className="text-xs" style={{ color: T.mute }}>Aucune donnée.</div>}
          {byZone.map(([zone, count]) => (
            <BarRow key={zone} label={zone} count={count} max={maxZone} color={T.blue} />
          ))}
        </div>

        <div>
          <div className="text-xs font-bold uppercase tracking-wide mb-2" style={{ color: T.mute }}>Derniers ajouts</div>
          <div className="space-y-2">
            {recent.length === 0 && <div className="text-xs" style={{ color: T.mute }}>Aucun prestataire pour l'instant.</div>}
            {recent.map((p) => (
              <div key={p.id} className="rounded-xl p-2.5 flex items-center gap-3" style={{ background: "var(--card)", border: `1px solid ${T.line}` }}>
                <PhotoOrAvatar photoUrl={p.photo_url} name={p.name} size={36} />
                <div className="flex-1 min-w-0">
                  <div className="font-semibold text-sm truncate" style={{ color: T.ink }}>{p.name}</div>
                  <StatusBadges verifiedField={p.verified_field} validated={p.validated} compact />
                </div>
                <div className="text-[10px] text-right shrink-0" style={{ color: T.mute }}>{timeAgo(p.created_at)}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

  const validate = async (id, value) => { await api.setValidated(id, value); onChanged(); };
