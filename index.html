<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dabakala Services</title>
<meta name="description" content="L'annuaire de prestataires de confiance à Dabakala." />
<meta name="theme-color" content="#0E2A56" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Dabakala" />
<script>
  window.__errors = [];
  function renderBanner() {
    if (!document.body) return;
    var el = document.getElementById("debug-banner");
    if (!el) {
      el = document.createElement("div");
      el.id = "debug-banner";
      el.style.cssText = "position:fixed;top:0;left:0;right:0;z-index:99999;background:#B3261E;color:#fff;padding:10px;font:12px monospace;white-space:pre-wrap;max-height:60vh;overflow:auto;";
      document.body.appendChild(el);
    }
    el.textContent = window.__errors.join("\n\n---\n\n");
  }
  function showDebugBanner(msg) {
    window.__errors.push(msg);
    if (document.body) renderBanner();
    else document.addEventListener("DOMContentLoaded", renderBanner);
  }
  window.addEventListener("error", function (e) {
    var tag = e.target && e.target.tagName;
    if (e.target && e.target !== window) {
      if (tag === "SCRIPT" || tag === "LINK") {
        showDebugBanner("Échec de chargement : " + (e.target.src || e.target.href));
      }
      // autres ressources (images, tuiles de carte...) : on ignore, non bloquant
      return;
    }
    if (e.message) {
      showDebugBanner("Erreur JS : " + e.message + "\n" + (e.filename || "") + ":" + (e.lineno || ""));
    }
  }, true);
  window.addEventListener("unhandledrejection", function (e) {
    showDebugBanner("Promesse rejetée : " + (e.reason && e.reason.message ? e.reason.message : e.reason));
  });
  window.addEventListener("load", function () {
    setTimeout(function () {
      var root = document.getElementById("root");
      if (root && root.children.length === 0 && window.__errors.length === 0) {
        showDebugBanner("Aucune erreur détectée, mais l'app ne s'est pas affichée après 4 secondes. Vérifie ta connexion internet ou essaie de vider le cache du navigateur.");
      }
    }, 4000);
  });
</script>
<link rel="stylesheet" href="./app.5MQKNDBK.css" />
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
  * { box-sizing: border-box; }

  :root {
    --bg: #F7F9FC;
    --card: #FFFFFF;
    --ink: #172033;
    --mute: #6B7280;
    --line: #E5E9F0;
  }
  [data-theme="dark"] {
    --bg: #0F1520;
    --card: #1A2130;
    --ink: #EDEFF4;
    --mute: #97A0B3;
    --line: #2A3243;
  }
  [data-theme="dark"] body { background: #0F1520; }

  /* Micro-interactions : retour tactile sur les éléments interactifs */
  button, a {
    transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.12s ease, box-shadow 0.15s ease;
  }
  button:active, a:active {
    transform: scale(0.95);
    opacity: 0.85;
  }
  input, select, textarea {
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  /* Échelle typographique plus affirmée sur les titres */
  .text-xl { font-size: 25px; letter-spacing: -0.02em; line-height: 1.2; }
  .text-lg { font-size: 21px; letter-spacing: -0.015em; line-height: 1.25; }
  .text-base { font-size: 17px; letter-spacing: -0.01em; }
  .text-sm.font-bold { font-size: 15px; letter-spacing: -0.005em; }

  @keyframes dabakala-shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .dabakala-skeleton {
    background: linear-gradient(90deg, #E5E9F0 25%, #EEF1F6 40%, #E5E9F0 60%);
    background-size: 250% 100%;
    animation: dabakala-shimmer 1.4s ease infinite;
  }

  @keyframes dabakala-screen-in {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .dabakala-screen {
    animation: dabakala-screen-in 0.22s ease-out;
  }

  /* ===== Adaptation desktop (≥1024px) ===== */
  @media (min-width: 1024px) {
    /* L'app s'élargit au lieu de rester en colonne étroite centrée */
    .dabakala-app-shell {
      max-width: 1280px !important;
      height: 100vh !important;
      box-shadow: 0 0 40px rgba(0,0,0,0.06);
    }

    /* Contenu + navigation en rangée plutôt qu'empilés (sidebar à gauche) */
    .dabakala-content-row {
      flex-direction: row-reverse !important;
      align-items: stretch !important;
      height: 100%;
    }
    .dabakala-content-row > .dabakala-screen {
      height: 100%;
      min-height: 0;
    }

    /* La navigation du bas devient une barre latérale */
    .dabakala-bottomnav {
      flex-direction: column !important;
      width: 240px;
      flex-shrink: 0;
      border-top: none !important;
      border-right: 1px solid var(--line);
      padding: 16px 0;
      height: 100%;
      overflow-y: auto;
      align-items: stretch;
    }
    .dabakala-bottomnav > button {
      flex: none !important;
      flex-direction: row !important;
      justify-content: flex-start !important;
      gap: 14px;
      padding: 13px 24px !important;
      border-radius: 0 999px 999px 0;
      font-size: 14px !important;
    }
    .dabakala-bottomnav > button span {
      font-size: 14px !important;
    }

    /* Grilles multi-colonnes pour mieux exploiter la largeur */
    .dabakala-grid-cards {
      display: grid !important;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .dabakala-grid-cards > * {
      width: auto !important;
      margin-top: 0 !important;
    }
    .dabakala-cat-grid {
      grid-template-columns: repeat(6, 1fr) !important;
    }
    .dabakala-actions-grid {
      grid-template-columns: repeat(4, 1fr) !important;
    }
    .dabakala-admin-grid {
      display: grid !important;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      align-content: start;
    }
    .dabakala-admin-grid > * {
      margin-top: 0 !important;
    }
    .dabakala-narrow-form {
      max-width: 640px !important;
      margin-left: auto !important;
      margin-right: auto !important;
      width: 100%;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js").catch(() => {});
  });
}
</script>

<script src="./app.56V3KKPE.js" defer></script>
</body>
</html>
