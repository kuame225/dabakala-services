  }, [pending, reviews]);

  const bell = <NotificationBell items={notifItems} storageKey={`dabakala:notif:admin:${session.user.id}`} />;

  if (section === "users") {
    return (
      <div className="flex flex-col h-full">
        <div className="flex items-center justify-end px-4 pt-2" style={{ background: T.cream }}>{bell}</div>
        <AdminNav section={section} setSection={setSection} />
        <div className="flex-1 min-h-0"><UsersAdmin currentUserId={session.user.id} /></div>
      </div>
    );
  }

  if (section === "categories") {
    return (
      <div className="flex flex-col h-full">
        <div className="flex items-center justify-end px-4 pt-2" style={{ background: T.cream }}>{bell}</div>
        <AdminNav section={section} setSection={setSection} />
        <CategoriesAdmin categories={categories} onChanged={onCategoriesChanged} />
      </div>
    );
  }

  if (section === "stats") {
    return (
      <div className="flex flex-col h-full">
        <div className="flex items-center justify-end px-4 pt-2" style={{ background: T.cream }}>{bell}</div>
        <AdminNav section={section} setSection={setSection} />
        <StatsAdmin providers={providers} categories={categories} />
      </div>
    );
  }

  return (
    <div className="flex flex-col h-full" style={{ background: T.cream }}>
      <div className="px-4 py-3" style={{ background: T.navy }}>
        <div className="flex items-center gap-2 text-white font-semibold">
          <span className="flex-1">📋 Panel Admin</span>
          <span style={{ color: "#fff" }}>{bell}</span>
        </div>
        <div className="mt-3 grid grid-cols-2 gap-2">
          <div className="rounded-lg px-2 py-1.5" style={{ background: "rgba(255,255,255,0.12)" }}>
            <div className="text-white text-lg font-bold">{providers.length}</div>
            <div className="text-[10px]" style={{ color: "#C9D5EA" }}>Prestataires</div>
          </div>
          <div className="rounded-lg px-2 py-1.5" style={{ background: "rgba(255,255,255,0.12)" }}>
            <div className="text-white text-lg font-bold">{pending.length}</div>
            <div className="text-[10px]" style={{ color: "#C9D5EA" }}>En attente</div>
          </div>
        </div>
      </div>
      <AdminNav section={section} setSection={setSection} />
      <div className="flex px-4 pt-2 gap-2">
        <button onClick={() => setTab("pending")} className="flex-1 rounded-lg py-1.5 text-xs font-semibold" style={{ background: tab === "pending" ? T.blue : "#fff", color: tab === "pending" ? "#fff" : T.ink, border: `1px solid ${T.line}` }}>À valider ({pending.length})</button>
        <button onClick={() => setTab("validated")} className="flex-1 rounded-lg py-1.5 text-xs font-semibold" style={{ background: tab === "validated" ? T.blue : "#fff", color: tab === "validated" ? "#fff" : T.ink, border: `1px solid ${T.line}` }}>Validés ({validated.length})</button>
      </div>
      <div className="flex-1 overflow-y-auto px-4 py-3 space-y-2">
        {list.length === 0 && <div className="text-sm text-center py-8" style={{ color: T.mute }}>Rien ici pour l'instant.</div>}
        {list.map((p) => {
          const cat = categories.find((c) => c.id === p.category_id) || {};
          if (editingId === p.id) {
            return (
              <ProviderEditForm key={p.id} provider={p} categories={categories}
                onCancel={() => setEditingId(null)}
                onSave={() => { setEditingId(null); onChanged(); }} />
            );
          }
          if (extrasId === p.id) {
            return <ProviderExtrasManager key={p.id} provider={p} onClose={() => setExtrasId(null)} />;
          }
          return (
            <div key={p.id} className="rounded-xl p-3" style={{ background: "var(--card)", border: `1px solid ${T.line}` }}>
              <div className="flex items-center gap-3">
                <PhotoOrAvatar photoUrl={p.photo_url} name={p.name} size={44} color={cat.color} />
                <div className="flex-1 min-w-0">
                  <div className="font-bold text-sm truncate" style={{ color: T.ink }}>{p.name}</div>
                  <div className="text-xs" style={{ color: T.mute }}>{cat.label} · {p.zone}</div>
                </div>
              </div>
              <div className="mt-2 flex items-center justify-between">
                <StatusBadges verifiedField={p.verified_field} validated={p.validated} compact />
                <button onClick={() => toggleField(p.id, p.verified_field)} className="text-[11px] font-semibold underline" style={{ color: T.mute }}>
                  {p.verified_field ? "Retirer terrain" : "Marquer terrain"}
                </button>
              </div>
              <div className="mt-2 flex gap-2">
                {!p.validated ? (
                  <button onClick={() => validate(p.id, true)} className="flex-1 rounded-lg py-2 text-xs font-semibold text-white" style={{ background: T.blue }}>✔ Valider le profil</button>
                ) : (
                  <button onClick={() => validate(p.id, false)} className="flex-1 rounded-lg py-2 text-xs font-semibold" style={{ background: "#F3F1EA", color: T.ink }}>✕ Retirer la validation</button>
                )}
              </div>
              <div className="mt-2 flex gap-2">
                <button onClick={() => setEditingId(p.id)} className="flex-1 rounded-lg py-1.5 text-[11px] font-semibold" style={{ background: T.cream, border: `1px solid ${T.line}`, color: T.ink }}>✏️ Modifier</button>
                <button onClick={() => setExtrasId(p.id)} className="flex-1 rounded-lg py-1.5 text-[11px] font-semibold" style={{ background: T.cream, border: `1px solid ${T.line}`, color: T.ink }}>🧰 Services/Photos</button>
                <button onClick={() => removeProvider(p.id)} className="flex-1 rounded-lg py-1.5 text-[11px] font-semibold" style={{ background: "#FDEDEC", color: "#B3261E" }}>🗑️</button>
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function App() {
  const [role, setRole] = useState("user");
  const [theme, setTheme] = useState(() => localStorage.getItem("dabakala:theme") || "light");

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    localStorage.setItem("dabakala:theme", theme);
  }, [theme]);
  const [entryChoice, setEntryChoiceRaw] = useState(() => localStorage.getItem("dabakala:entryChoice"));
  const setEntryChoice = (v) => { localStorage.setItem("dabakala:entryChoice", v); setEntryChoiceRaw(v); };
  const [showOnboarding, setShowOnboardingRaw] = useState(() => localStorage.getItem("dabakala:showOnboarding") === "1");
  const setShowOnboarding = (v) => { localStorage.setItem("dabakala:showOnboarding", v ? "1" : "0"); setShowOnboardingRaw(v); };
  const [userTab, setUserTab] = useState("home");
  const [menuOpen, setMenuOpen] = useState(false);
  const [providers, setProviders] = useState([]);
  const [reviews, setReviews] = useState([]);
  const [categories, setCategories] = useState(FALLBACK_CATEGORIES);
  const [openProvider, setOpenProvider] = useState(null);
  const openProviderById = (id) => {
    setOpenProvider(id);
    const url = new URL(window.location.href);
    url.searchParams.set("prestataire", id);
    window.history.replaceState({}, "", url);
  };
  const closeProvider = () => {
    setOpenProvider(null);
    const url = new URL(window.location.href);
    url.searchParams.delete("prestataire");
    window.history.replaceState({}, "", url);
  };
  const [session, setSession] = useState(null);
  const [profile, setProfile] = useState(null);
  const [loaded, setLoaded] = useState(false);

  const refreshProviders = async () => setProviders(await api.fetchProviders());
  const refreshCategories = async () => setCategories(await api.fetchCategories());
  const refreshReviews = async () => setReviews(await api.fetchRecentReviews());

  useEffect(() => {
    if (!isConfigured) { setLoaded(true); return; }
    (async () => {
      setCategories(await api.fetchCategories());
      const list = await api.fetchProviders();
      setProviders(list);
      const sharedId = new URLSearchParams(window.location.search).get("prestataire");
      if (sharedId && list.some((p) => p.id === sharedId)) {
        setRole("user");
        setOpenProvider(sharedId);
      }
      const { data: { session } } = await supabase.auth.getSession();
      setSession(session);
      if (session) {
        setProfile(await api.getProfile(session.user.id));
        refreshReviews();
      }
      setLoaded(true);
    })();
    const { data: sub } = supabase.auth.onAuthStateChange(async (_event, sess) => {
      setSession(sess);
      setProfile(sess ? await api.getProfile(sess.user.id) : null);
      refreshProviders();
      if (sess) refreshReviews();
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  if (!isConfigured) {
    return (
      <div className="w-full" style={{ minHeight: "100dvh", background: T.cream, maxWidth: 480, margin: "0 auto" }}>
        <SetupNotice />
      </div>
    );
  }

  if (!loaded) {
    return (
      <div className="w-full flex flex-col items-center justify-center" style={{ height: "100dvh", background: `linear-gradient(160deg, ${T.navy} 0%, #0A3576 100%)`, maxWidth: 480, margin: "0 auto" }}>
        <div className="rounded-3xl flex items-center justify-center" style={{ width: 84, height: 84, background: "rgba(255,255,255,0.12)" }}>
          <Icon name="handshake" size={40} color="#fff" strokeWidth={1.6} />
        </div>
        <div className="mt-5 font-extrabold text-2xl">
          <span style={{ color: "#fff" }}>Dabakala</span> <span style={{ color: T.orange }}>Services</span>
        </div>
        <div className="text-xs mt-1.5" style={{ color: "rgba(255,255,255,0.75)" }}>Le service qu'il vous faut, près de chez vous.</div>
        <div className="mt-8" style={{ width: 28, height: 28, borderRadius: "50%", border: "3px solid rgba(255,255,255,0.25)", borderTopColor: "#fff", animation: "dabakala-spin 0.8s linear infinite" }} />
        <style>{`@keyframes dabakala-spin { to { transform: rotate(360deg); } }`}</style>
      </div>
    );
  }

  if (!entryChoice) {
    return (
      <div className="w-full flex flex-col" style={{ height: "100dvh", background: T.bg, maxWidth: 480, margin: "0 auto" }}>
        <div className="flex-1 overflow-y-auto px-5 py-6">
          <div className="flex flex-col items-center text-center mb-5">
            <div className="rounded-full flex items-center justify-center mb-3" style={{ width: 76, height: 76, background: "#fff", boxShadow: T.shadow, overflow: "hidden" }}>
              <img src="./banner-hero.jpg" alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} />
            </div>
            <div className="font-extrabold text-lg leading-tight">
              <span style={{ color: T.navy }}>DABAKALA</span> <span style={{ color: T.orange }}>SERVICES</span>
            </div>
            <div className="text-xs mt-1" style={{ color: T.mute }}>Le rendez-vous des services de confiance à Dabakala</div>
          </div>

          <div className="text-center mb-1.5">
            <span className="font-extrabold text-xl" style={{ color: T.ink }}>Que souhaitez-vous faire </span>
            <span className="font-extrabold text-xl" style={{ color: T.orange }}>aujourd'hui ?</span>
          </div>
          <p className="text-xs text-center mb-5" style={{ color: T.mute }}>
            Dabakala Services connecte les habitants et les prestataires pour des services rapides et fiables.
          </p>

          <button onClick={() => setEntryChoice("search")} className="w-full rounded-2xl p-4 text-left mb-3" style={{ background: "linear-gradient(180deg, #EAF0FB 0%, #fff 55%)", border: `1px solid ${T.line}` }}>
            <div className="flex flex-col items-center text-center">
              <div className="rounded-full flex items-center justify-center mb-2" style={{ width: 56, height: 56, background: "#DCE6FA" }}>
                <Icon name="search" size={26} color={T.blue} />
              </div>
              <div className="font-extrabold text-base" style={{ color: T.ink }}>Je recherche<br />un service</div>
              <div className="text-xs mt-1.5" style={{ color: T.mute }}>Trouvez rapidement le prestataire qu'il vous faut parmi nos catégories.</div>
              <div className="flex items-center gap-2 mt-3">
                {["wrench", "car", "scissors", "utensils"].map((ic) => (
                  <div key={ic} className="rounded-full flex items-center justify-center" style={{ width: 34, height: 34, background: "#DCE6FA" }}>
                    <Icon name={ic} size={15} color={T.blue} />
                  </div>
                ))}
              </div>
              <div className="w-full mt-3 flex items-center justify-center gap-2 rounded-xl py-2.5 font-bold text-sm text-white" style={{ background: T.blue }}>
                Rechercher <Icon name="chevronRight" size={14} color="#fff" />
              </div>
              <div className="flex items-center gap-1.5 mt-2.5 text-[11px] font-semibold" style={{ color: T.blue }}>
                <Icon name="shieldCheck" size={12} color={T.blue} /> Des prestataires vérifiés à Dabakala
              </div>
            </div>
          </button>

          <button onClick={() => { setEntryChoice("provide"); setShowOnboarding(true); }} className="w-full rounded-2xl p-4 text-left mb-5" style={{ background: "linear-gradient(180deg, #FDEFE0 0%, #fff 55%)", border: `1px solid ${T.line}` }}>
            <div className="flex flex-col items-center text-center">
              <div className="rounded-full flex items-center justify-center mb-2" style={{ width: 56, height: 56, background: "#FBE0C4" }}>
                <Icon name="store" size={26} color={T.orange} />
              </div>
              <div className="font-extrabold text-base" style={{ color: T.ink }}>Je propose<br />un service</div>
              <div className="text-xs mt-1.5" style={{ color: T.mute }}>Inscrivez votre activité et développez votre clientèle à Dabakala.</div>
              <div className="flex items-center gap-2 mt-3">
                {["eye", "users", "gift", "checkCircle"].map((ic) => (
                  <div key={ic} className="rounded-full flex items-center justify-center" style={{ width: 34, height: 34, background: "#FBE0C4" }}>
                    <Icon name={ic} size={15} color={T.orange} />
                  </div>
                ))}
              </div>
              <div className="w-full mt-3 flex items-center justify-center gap-2 rounded-xl py-2.5 font-bold text-sm text-white" style={{ background: T.orange }}>
                Inscrire mon activité gratuitement <Icon name="chevronRight" size={14} color="#fff" />
              </div>
              <div className="flex items-center gap-1.5 mt-2.5 text-[11px] font-semibold" style={{ color: T.orange }}>
                <Icon name="shieldCheck" size={12} color={T.orange} /> Inscription rapide et sans frais
              </div>
            </div>
          </button>

          <div className="rounded-2xl p-4 mb-5" style={{ background: "#fff", boxShadow: T.shadow }}>
            <div className="font-bold text-sm mb-2 text-center" style={{ color: T.ink }}>Dabakala Services, c'est :</div>
            <div className="flex flex-wrap justify-center gap-x-3 gap-y-1.5 text-[11px] font-medium" style={{ color: T.mute }}>
              {["Des prestataires locaux", "De confiance", "Des services pour tous", "Une plateforme 100% Dabakala"].map((t) => (
                <span key={t} className="flex items-center gap-1"><Icon name="checkCircle" size={12} color={T.greenDeep} /> {t}</span>
              ))}
            </div>
          </div>

          <div className="flex items-center gap-2 mb-4">
            <div className="flex-1 h-px" style={{ background: T.line }} />
            <span className="text-[11px] font-semibold" style={{ color: T.mute }}>Déjà inscrit ?</span>
            <div className="flex-1 h-px" style={{ background: T.line }} />
          </div>
          <button onClick={() => { setEntryChoice("search"); setUserTab("profile"); }} className="w-full flex items-center justify-center gap-2 rounded-xl py-3 font-bold text-sm" style={{ border: `1.5px solid ${T.blue}`, color: T.blue }}>
            <Icon name="user" size={16} color={T.blue} /> Se connecter à mon compte
          </button>
        </div>
        <div className="flex" style={{ background: "#fff", borderTop: `1px solid ${T.line}`, flexShrink: 0 }}>
          {[["home", "Accueil"], ["search", "Recherche"], ["favorites", "Favoris"], ["profile", "Profil"]].map(([id, label]) => (
            <button key={id} onClick={() => { setEntryChoice("search"); setUserTab(id); }} className="flex-1 flex flex-col items-center gap-0.5 py-2.5">
              <Icon name={id === "home" ? "home" : id === "search" ? "search" : id === "favorites" ? "heart" : "user"} size={20} color={T.mute} />
              <span className="text-[10px] font-semibold" style={{ color: T.mute }}>{label}</span>
            </button>
          ))}
        </div>
      </div>
    );
  }

  const ROLES = [
    { id: "user", label: "Espace utilisateur", icon: "user" },
    { id: "agent", label: "Espace agent", icon: "wrench" },
    { id: "admin", label: "Espace admin", icon: "shieldCheck" },
  ];
  const BOTTOM_TABS = [
    { id: "home", label: "Accueil", icon: "home" },
    { id: "search", label: "Recherche", icon: "search" },
    { id: "favorites", label: "Favoris", icon: "heart" },
    { id: "profile", label: "Profil", icon: "user" },
  ];

  const showBottomNav = role === "user" && !openProvider;

  return (
    <div className="flex flex-col w-full" style={{ height: "100dvh", background: T.cream, maxWidth: 480, margin: "0 auto", overflow: "hidden" }}>
      <datalist id="dabakala-zones">
        {ZONES.map((z) => <option key={z} value={z} />)}
      </datalist>

      {/* Barre du haut : menu hamburger + profil */}
      {!openProvider && (
        <div className="relative flex items-center justify-between px-4 py-3" style={{ background: "var(--card)", borderBottom: `1px solid ${T.line}`, flexShrink: 0 }}>
          <button onClick={() => setMenuOpen((v) => !v)} style={{ color: T.ink }}><Icon name="menu" size={22} /></button>
          <button onClick={() => { setRole("user"); setUserTab("profile"); }} className="rounded-full flex items-center justify-center" style={{ width: 32, height: 32, background: T.bg, border: `1px solid ${T.line}`, color: T.navy }}>
            <Icon name="user" size={16} />
          </button>

          {menuOpen && (
            <>
              <div onClick={() => setMenuOpen(false)} className="fixed inset-0" style={{ zIndex: 60, background: "rgba(0,0,0,0.15)" }} />
              <div className="absolute left-4 top-14 rounded-2xl overflow-hidden" style={{ background: "var(--card)", boxShadow: "0 6px 24px rgba(0,0,0,0.18)", zIndex: 61, width: 220 }}>
                {ROLES.map((r) => (
                  <button key={r.id} onClick={() => { setRole(r.id); setMenuOpen(false); closeProvider(); }}
                    className="w-full flex items-center gap-2.5 px-4 py-3 text-sm font-semibold text-left"
                    style={{ background: role === r.id ? T.bg : "#fff", color: role === r.id ? T.navy : T.ink, borderBottom: `1px solid ${T.line}` }}>
                    <Icon name={r.icon} size={16} color={role === r.id ? T.navy : T.mute} /> {r.label}
                  </button>
                ))}
                {session && (
                  <button onClick={() => { supabase.auth.signOut(); setMenuOpen(false); }} className="w-full flex items-center gap-2.5 px-4 py-3 text-sm font-semibold text-left" style={{ color: "#B3261E" }}>
                    <Icon name="logout" size={16} color="#B3261E" /> Déconnexion
                  </button>
                )}
              </div>
            </>
          )}
        </div>
      )}

      {session && !openProvider && (
        <div className="flex items-center justify-between px-3 py-1 text-[10px]" style={{ background: T.bg, color: T.mute, flexShrink: 0 }}>
          <span>{session.user.email} · {profile ? profile.role : "…"}</span>
        </div>
      )}

      <div className="flex-1 min-h-0 dabakala-screen" key={`${role}-${userTab}-${openProvider || ""}-${showOnboarding}`}>
        {!loaded ? (
          <div className="h-full flex items-center justify-center text-sm" style={{ color: T.mute }}>Chargement…</div>
        ) : showOnboarding ? (
          <ProviderOnboarding session={session} categories={categories}
            onClose={() => setShowOnboarding(false)}
            onDone={() => { setShowOnboarding(false); refreshProviders(); }} />
        ) : openProvider ? (
          <ProviderSheet provider={providers.find((p) => p.id === openProvider) || openProvider} categories={categories} session={session} onBack={closeProvider} />
        ) : role === "user" ? (
          <UserHome providers={providers} categories={categories} session={session} onOpen={(p) => openProviderById(p.id)} userTab={userTab} onNavigate={setUserTab} onProposeService={() => setShowOnboarding(true)} theme={theme} setTheme={setTheme} />
        ) : role === "agent" ? (
          <AuthGate session={session} profile={profile} allow={["agent", "admin"]}>
            <AgentHome providers={providers} categories={categories} reviews={reviews} session={session} onChanged={refreshProviders} />
          </AuthGate>
        ) : (
          <AuthGate session={session} profile={profile} allow={["admin"]}>
            <AdminHome providers={providers} categories={categories} reviews={reviews} session={session} onChanged={refreshProviders} onCategoriesChanged={refreshCategories} />
          </AuthGate>
        )}
      </div>

      {/* Navigation en bas — écran Utilisateur uniquement */}
      {showBottomNav && !showOnboarding && (
        <div className="flex" style={{ background: "var(--card)", borderTop: `1px solid ${T.line}`, flexShrink: 0 }}>
          {BOTTOM_TABS.map((t) => {
            const active = userTab === t.id;
            return (
              <button key={t.id} onClick={() => setUserTab(t.id)} className="flex-1 flex flex-col items-center gap-0.5 py-2.5">
                <Icon name={t.icon} size={20} color={active ? T.navy : T.mute} filled={active && t.id === "favorites"} />
                <span className="text-[10px] font-semibold" style={{ color: active ? T.navy : T.mute }}>{t.label}</span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
})();
}
</script>
</body>
</html>
